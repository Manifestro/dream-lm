# Hyperparameter configuration for Stage 2 training.
#
# All values controlled here — no magic numbers in code.

model:
  d_model: 128
  n_heads: 4
  n_layers: 4
  ff_mult: 4
  max_seq_len: 256
  activation: "gelu"
  tie_embeddings: true
  fast_weight_r: 0  # 0 = disabled (Stage 4 structure only, set >0 to enable)

training:
  lr: 3.0e-4
  weight_decay: 0.1
  grad_clip: 1.0
  batch_size: 64
  seq_len: 128
  epochs: 10
  warmup_steps: 100
  scheduler: "cosine"
  device: "cpu"   # "cpu" or "cuda"

data:
  corpus: "data/tiny-shakespeare.txt"
  vocab_file: "data/vocab.json"
  val_split: 0.05

eval:
  target_perplexity: 15.0
  sample_length: 256
  temperatures: [0.6, 0.8, 1.0, 1.2]

ema:
  alpha: 0.99        # smoothing factor (0.9 = fast, 0.99 = medium, 0.999 = slow)
  eps: 1.0e-8        # numerical stability constant

gate:
  theta_0: 0.0       # base threshold (centered on EMA mean)
  beta: 5.0          # gate temperature (higher = sharper transition)
  G: 0               # channel groups (0 = scalar gate, 8 = vectorized Stage 8)

stdp:
  eta: 0.01          # STDP learning rate
  lambda_decay: 0.95 # exponential decay per step (1.0 = no decay)
  max_norm: 1.0      # max Frobenius norm per head
